<header class="navbar bg-base-100 border-b border-base-300 px-6">
    <div class="flex-1">
        <button class="btn btn-ghost btn-circle" (click)="toggleSidebar.emit()">
            <mat-icon>
                menu
            </mat-icon>
        </button>
        <span class="ml-4 text-xl font-semibold">
            {{ layout.pageTitle() }}
        </span>
    </div>
    <div class="dropdown dropdown-end">
        <label tabindex="0" class="btn btn-ghost h-auto px-3">
            <div class="flex items-center gap-3">
                <div class="text-right hidden md:block">
                    <p class="font-semibold leading-none">
                        {{ currentUser.user()?.displayName }}
                    </p>
                    <p class="text-xs opacity-60">
                        {{ currentUser.user()?.roles?.[0] }}
                    </p>
                </div>
                <div class="avatar">
                    <div class="bg-primary text-primary-content rounded-full w-11 flex items-center justify-center">
                        <span class="text-lg font-semibold">
                            {{ currentUser.user()?.displayName?.charAt(0) }}
                        </span>
                    </div>
                </div>
            </div>
        </label>
        <ul tabindex="0"
            class="dropdown-content z-50 menu p-2 shadow-lg bg-base-100 rounded-box w-60 border border-base-300 mt-3">
            <li class="menu-title">
                <span>
                    {{ currentUser.user()?.displayName }}
                </span>
                <span class="text-xs">
                    {{ currentUser.user()?.email }}
                </span>
            </li>
            <li>
                <a routerLink="/profile">
                    <mat-icon>account_circle</mat-icon>
                    Profile
                </a>
            </li>
            <li>
                <a>
                    <mat-icon>settings</mat-icon>
                    Settings
                </a>
            </li>
            <div class="divider my-1"></div>
            <li>
                <a class="text-error" (click)="logout()">
                    <mat-icon>
                        logout
                    </mat-icon>
                    Logout
                </a>
            </li>
        </ul>
    </div>
</header>
