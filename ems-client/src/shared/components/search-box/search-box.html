<label class="input input-bordered flex items-center gap-2 w-full">

    <mat-icon class="opacity-60">
        search
    </mat-icon>

    <input
        type="text"
        class="grow"
        [placeholder]="placeholder()"
        [value]="value()"
        (input)="onInput($event)" />

    @if (value()) {

        <button
            type="button"
            class="btn btn-ghost btn-xs btn-circle"
            (click)="clear()">
            <mat-icon class="!text-lg">
                close
            </mat-icon>
        </button>
    }
</label>
