<div class="card bg-base-100 border border-base-300 shadow-sm">
    <div class="card-body">

        <label class="input input-bordered flex items-center gap-2">

            <mat-icon>
                search
            </mat-icon>

            <input
                type="text"
                class="grow"
                placeholder="Search departments..."
                [ngModel]="search()"
                (ngModelChange)="onSearch($event)">

        </label>

    </div>
</div>
