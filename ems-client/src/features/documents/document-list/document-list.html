<app-page-header
    title="Documents"
    subtitle="Manage employee documents.">
</app-page-header>

    
<div class="card bg-base-100 border border-base-300 shadow-sm mt-4">
    <div class="card-body">
        <input 
            type="text"
            class="input input-bordered w-full max-w-md" 
            placeholder="Search Users..."
            [value]="state().search" 
            (input)="search($any($event.target).value)">
    </div>
</div>

<div class="mt-6">

    <app-document-table
        [employees]="employees()"
        [loading]="loading()"
        [sortBy]="state().sortBy"
        [sortDirection]="state().sortDirection"
        (sortChange)="sort($event)"
        (employeeSelected)="open($event)">
    </app-document-table>

</div>

<div class="mt-6">

    @if(page(); as page){

        <app-pagination
            [pageNumber]="page.pageNumber"
            [pageSize]="page.pageSize"
            [totalCount]="page.totalCount"
            (pageChange)="changePage($event)">
        </app-pagination>

    }

</div>
