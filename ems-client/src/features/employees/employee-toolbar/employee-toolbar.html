<div class="card bg-base-100 shadow-sm border border-base-300">
    <div class="card-body">
        <div class="flex flex-col lg:flex-row gap-4 justify-between">
            <div class="flex flex-1 flex-col md:flex-row gap-4">

                <app-search-box class="flex-1" placeholder="Search employees..." [value]="search()"
                    (valueChange)="searchChange.emit($event)">
                </app-search-box>


                <!-- Department Filter -->
                <select class="select select-bordered" 
                (change)="onDepartmentChange($event)">
                    <option value="">
                        All Departments
                    </option>
                    @for(department of departments(); track department.id){
                    <option [value]="department.id">
                        {{ department.name }}
                    </option>
                    }
                </select>


                <!-- Designation Filter -->
                <select class="select select-bordered" 
                (change)="onDesignationChanged($event)">
                    <option value="">
                        All Designations
                    </option>
                    @for(designation of designations(); track designation.id){
                    <option [value]="designation.id">
                        {{ designation.name }}
                    </option>
                    }
                </select>


                <!-- Status Filter -->
                <select
                    class="select select-bordered"
                    (change)="onStatusChanged($event)">
                    <option value="">
                        All Statuses
                    </option>
                    @for(status of statuses(); track status.value){
                        <option [value]="status.value">
                            {{ status.label }}
                        </option>
                    }
                </select>
            </div>
        </div>
    </div>
</div>
