<app-page-header
    title="Edit Employee"
    subtitle="Update employee information.">
</app-page-header>

<div class="mt-6">
    @if (loading()) {
        <div class="flex justify-center py-20">
            <span class="loading loading-spinner loading-lg"></span>
        </div>
    } @else {
        <app-employee-form
            mode="edit"
            [employee]="employee()">
        </app-employee-form>
    }
</div>
